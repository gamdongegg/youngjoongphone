    const s=$('#callstatus'); if(s) s.textContent='00:00';
    if(state.callTimer) clearInterval(state.callTimer);
    state.callTimer=setInterval(()=>{sec++;const e=$('#callstatus');if(e)e.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`},1000);
    let idx=0;
    function next(){
      if(!alive()) return;
      if(idx >= dialogues.length){
        const e=$('#callstatus'); if(e) e.textContent='통화 종료';
        if(state.callTimer){clearInterval(state.callTimer);state.callTimer=null}
        setTimeout(()=>{ if(alive()){ goHome(); sendYeongjungFinalKakao(); } }, 1000);
        return;
      }
      const d=dialogues[idx++];
      const el=$('#dialogue');
      if(el) el.innerHTML = d.who==='나'
        ? `<div style="margin-bottom:8px;color:#9fcbff">${escapeHtml(d.text)}</div>`
        : `<div style="margin-bottom:8px">${escapeHtml(d.text)}</div>`;
      setTimeout(next, d.short ? 1500 : 2500);
    }
    setTimeout(next, 600);
  };
}
$('#lockPhone').addEventListener('click',e=>{e.stopPropagation();unlock();setTimeout(()=>openApp('phone'),100)});
$('#lockCamera').addEventListener('click',e=>{e.stopPropagation();unlock();setTimeout(()=>openApp('camera'),100)});
$('#screen').addEventListener('click',e=>{
 const a=e.target.closest('[data-action]')?.dataset.action;
 if(a==='endcall'){state.callToken=(state.callToken||0)+1;goHome();toast('통화가 종료되었습니다.')}
 if(a==='acceptcall'){state.acceptCall&&state.acceptCall()}
 if(a==='declinecall'){
  state.callToken=(state.callToken||0)+1;goHome();toast('통화를 거절했습니다.');
  state.declineCount++;
  if(state.declineCount===1) scheduleRedial(2500);            // 첫 번째 거절 → 곧바로 두 번째 전화
  else if(!state.yjKakaoSent) sendYeongjungKakao();           // 두 번 거절 → 카톡 도착
  else if(state.yjRead && !state.callAccepted) scheduleRedial(4000); // 카톡 읽은 뒤엔 받을 때까지 재전화
 }
 if(a==='nextline'){toast('대사는 아직 비어 있습니다.')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.app)goHome()});
</script>
</body></html>
